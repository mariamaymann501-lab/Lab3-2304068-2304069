<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Edit Book</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main><h1>Edit Book</h1>
{% with messages = get_flashed_messages() %}{% if messages %}<ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}{% endwith %}
<form method="post" class="fields" enctype="multipart/form-data">
<label>Title <input name="title" value="{{ book.title }}" required maxlength="150"></label>
<label>Price <input name="price" type="number" min="0" step="0.01" value="{{ book.price }}" required></label>
<label>Author <select name="author_id" required>
{% for author in authors %}<option value="{{ author.author_id }}" {% if author.author_id == book.author_id %}selected{% endif %}>{{ author.name }} (ID {{ author.author_id }})</option>{% endfor %}
</select></label>
{% if book.image_filename %}<div class="current-image"><img class="preview" src="{{ url_for('static', filename='uploads/books/' ~ book.image_filename) }}" alt="Current cover"><label class="inline"><input type="checkbox" name="remove_image" value="1"> Remove current cover</label></div>{% endif %}
<label>{% if book.image_filename %}Replace cover{% else %}Cover image (optional){% endif %} <input name="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label>
<button type="submit">Save Changes</button><a href="{{ url_for('home') }}">Cancel</a>
</form></main></body></html>
